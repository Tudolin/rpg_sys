{% extends "base.html" %}

{% block title %}Entrar{% endblock %}

{% block content %}
<div class="panel form-panel">
    <div class="brand-header">
        <img src="{{ url_for('static', filename='logo.png') }}" width="60" alt="Logo RPG">
        <h2>Entrar na Taverna</h2>
    </div>
    <form method="POST">
        <label for="username">Usuário</label>
        <input type="text" id="username" name="username" required autofocus>

        <label for="password">Senha</label>
        <input type="password" id="password" name="password" required>

        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <button type="submit" class="btn btn-primary btn-block">⚔️ Entrar</button>
    </form>
    <p class="text-center mt-3">Não tem conta? <a href="{{ url_for('register') }}">Crie uma agora</a></p>
</div>
{% endblock %}
