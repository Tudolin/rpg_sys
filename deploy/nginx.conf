# Reverse proxy for RPG Sys, with the WebSocket upgrade headers Socket.IO
# needs. Copy to /etc/nginx/sites-available/rpg-sys, adjust server_name,
# then: ln -s ../sites-available/rpg-sys /etc/nginx/sites-enabled/
#
# Run `certbot --nginx -d rpg.example.com` afterwards to add TLS — it will
# rewrite this file to add the certificate directives and an HTTPS server
# block automatically.

server {
    listen 80;
    listen [::]:80;
    server_name rpg.example.com;

    client_max_body_size 55m;

    location /static/ {
        alias /opt/rpg_sys/static/;
        expires 7d;
        access_log off;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:8000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
